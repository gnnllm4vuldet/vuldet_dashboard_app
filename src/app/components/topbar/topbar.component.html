<div class="topbar">
  <div class="tb-left">
    <div class="tb-logo">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="1" width="6" height="6" rx="1.5" fill="white" opacity=".8"/>
        <rect x="9" y="1" width="6" height="6" rx="1.5" fill="white" opacity=".4"/>
        <rect x="1" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".4"/>
        <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#4a6cf7"/>
      </svg>
    </div>
    <span class="tb-title">{{ 'TOPBAR.TITLE' | translate }}</span>
  </div>

  <div class="tb-langs">
    <button
      *ngFor="let lang of langs"
      class="lang-btn"
      [class.active]="lang === currentLang"
      (click)="setLang(lang)">
      {{ lang.toUpperCase() }}
    </button>
  </div>

  <div class="method-chips">
    <span class="mc mc-gnn">GNN</span>
    <span class="mc mc-gpt">GPT-4o</span>
    <span class="mc mc-claude">Claude</span>
  </div>
</div>
